<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人简历 — 求职作品集</title>
<style>
/* ================================================================
   色彩变量：咖啡 + 抹茶绿 + 奶白
   ================================================================ */
:root {
  /* 咖啡色系 */
  --coffee-deep: #4A2722;
  --coffee: #6B3D2E;
  --coffee-light: #8B6F5E;
  --coffee-pale: #C4A89C;
  /* 抹茶绿色系 */
  --matcha: #7B8D6E;
  --matcha-light: #A8B89A;
  --matcha-pale: #D4DDCE;
  /* 奶白色系 */
  --cream: #FBF7F2;
  --white: #FFFFFF;
  --cream-dark: #F0EBE4;
  /* 功能色 */
  --text: #3D2C26;
  --text-secondary: #6B574E;
  --text-hint: #A8998F;
  --gold: #C4946B;
  --red: #B8453A;
  --green: #5B8C5A;
  /* 圆角 & 阴影 */
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 4px rgba(74,39,34,0.06);
  --shadow: 0 2px 12px rgba(74,39,34,0.08);
  --shadow-lg: 0 4px 24px rgba(74,39,34,0.12);
  /* 字体 */
  --font-fangsong: "FangSong", "仿宋", "STFangsong", "华文仿宋", serif;
  --font-serif: "Noto Serif SC", "Source Han Serif SC", "思源宋体", "Songti SC", serif;
  --font-sans: "Noto Sans SC", "Source Han Sans SC", "思源黑体", "Microsoft YaHei", sans-serif;
  --transition: 0.25s ease;
}

/* ================================================================
   基础重置
   ================================================================ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 64px; }
body {
  font-family: var(--font-sans);
  background: var(--cream);
  color: var(--text);
  line-height: 1.7;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}

/* ================================================================
   导航栏
   ================================================================ */
.navbar {
  position: fixed; top:0; left:0; right:0; z-index:100;
  height: 60px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(139,111,94,0.15);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px;
}
.nav-brand {
  font-family: var(--font-fangsong);
  font-size: 20px;
  font-weight: bold;
  color: var(--coffee-deep);
  letter-spacing: 2px;
}
.nav-links { display:flex; list-style:none; gap:2px; }
.nav-links a {
  color: var(--text-secondary);
  text-decoration: none;
  padding: 6px 16px; border-radius: 20px;
  font-size: 14px;
  cursor: pointer;
  transition: all var(--transition);
}
.nav-links a:hover { color: var(--coffee); background: var(--cream-dark); }
.nav-links a.active { color: var(--coffee-deep); background: rgba(196,148,107,0.25); font-weight: 600; }
.nav-right { display:flex; align-items:center; gap:8px; }
.nav-right .btn { white-space: nowrap; }

/* ================================================================
   通用板块
   ================================================================ */
.section { padding: 80px 28px; position: relative; }
.section-inner { max-width: 1000px; margin:0 auto; position: relative; z-index: 1; }
/* 板块间装饰分隔 */
.section::after {
  content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 60px; height: 3px; border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--coffee-pale), transparent);
}
.section:last-of-type::after { display:none; }
.section-tag {
  display: inline-block;
  padding: 3px 14px;
  font-size: 11px; font-weight: 700; letter-spacing: 3px;
  color: var(--coffee-light);
  border: 1px solid var(--coffee-pale);
  border-radius: 20px;
  margin-bottom: 10px;
  text-transform: uppercase;
}
.section-title {
  font-family: var(--section-title-font);
  font-size: 32px; font-weight: bold;
  color: var(--coffee-deep);
  margin-bottom: 12px;
  position: relative;
}
.section-subtitle {
  font-size: 15px; color: var(--text-secondary);
  margin-bottom: 36px; max-width: 520px;
}
/* 板块背景色交替 */
.section-light { background: var(--cream); }
.section-matcha { background: var(--white); }

/* 卡片升级 */
.card-upgrade {
  background: var(--white);
  border-radius: var(--radius-lg);
  padding: 28px 24px;
  box-shadow: var(--shadow-sm);
  border: 1px solid rgba(139,111,94,0.06);
  transition: all var(--transition);
}
.card-upgrade:hover {
  box-shadow: var(--shadow);
  border-color: rgba(139,111,94,0.15);
}

/* ================================================================
   Hero 区
   ================================================================ */
.hero { padding: 100px 28px 72px; text-align: center; }
/* Hero 背景板 */
.hero-banner {
  position: relative;
  max-width: 700px; margin: 0 auto 0;
  padding: 48px 32px 40px;
  border-radius: var(--radius-lg);
  background: linear-gradient(160deg, #6B3D2E 0%, #8B6F5E 40%, #C4A89C 100%);
  background-size: cover;
  background-position: center;
  color: #fff;
  overflow: hidden;
}
.hero-banner::before {
  content: ''; position: absolute; inset: 0;
  background: rgba(0,0,0,0.2);
  border-radius: var(--radius-lg);
}
.hero-banner > * { position: relative; z-index: 1; }
.hero-photo {
  width: 140px; height: 140px; border-radius: 50%;
  object-fit: cover; margin-bottom: 24px;
  border: 3px solid rgba(255,255,255,0.8);
  box-shadow: var(--shadow-lg);
  border: 3px solid var(--matcha-pale);
  box-shadow: var(--shadow);
}
.hero-photo-placeholder {
  width: 140px; height: 140px; border-radius: 50%;
  margin: 0 auto 24px;
  background: var(--matcha-pale);
  display: flex; align-items: center; justify-content: center;
  font-size: 56px;
}
:root {
  --hero-name-font: var(--font-fangsong);
  --section-title-font: var(--font-serif);
  --body-font: var(--font-sans);
  --hero-name-color: #ffffff;
  --hero-title-color: rgba(255,255,255,0.9);
}
body { font-family: var(--body-font); }
.hero-banner .hero-name {
  font-family: var(--hero-name-font);
  font-size: 40px; font-weight: var(--hero-name-weight, bold);
  color: var(--hero-name-color);
  letter-spacing: 3px;
  margin-bottom: 6px;
  text-shadow: var(--hero-name-shadow, 0 2px 8px rgba(0,0,0,0.3));
}
.hero-banner .hero-title {
  font-size: 17px; color: var(--hero-title-color);
  margin-bottom: 12px;
}
.hero-banner .hero-meta {
  display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;
  font-size: 13px; color: rgba(255,255,255,0.7);
  margin-bottom: 0;
}
.hero-banner .hero-meta span { display:flex; align-items:center; gap:4px; }
.hero-bio {
  max-width: 500px; margin: 0 auto 20px;
  font-size: 14px; color: var(--text-secondary);
  line-height: 1.8;
}
.hero-tags { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin-top:16px; }
.hero-actions { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }

/* ================================================================
   按钮
   ================================================================ */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 22px; font-size: 14px; font-family: var(--font-sans);
  border: none; border-radius: 24px;
  cursor: pointer; transition: all var(--transition);
  text-decoration: none;
}
.btn-primary { background: var(--coffee); color: #fff; }
.btn-primary:hover { background: var(--coffee-deep); }
.btn-outline {
  background: transparent; color: var(--coffee);
  border: 1.5px solid var(--coffee-pale);
}
.btn-outline:hover { border-color: var(--coffee); background: rgba(107,61,46,0.04); }
.btn-matcha { background: var(--matcha); color: #fff; }
.btn-matcha:hover { background: #6A7D5E; }
.btn-sm { padding: 5px 14px; font-size: 12px; }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover { background: #A03D33; }

/* ================================================================
   标签
   ================================================================ */
.tag {
  display: inline-block;
  padding: 4px 14px; font-size: 12px;
  border-radius: 20px;
  background: var(--cream-dark);
  color: var(--text-secondary);
  border: 1px solid transparent;
}
.tag-active {
  background: var(--matcha);
  color: #fff;
  border-color: var(--matcha);
}
.tag-outline {
  background: transparent;
  border: 1px solid var(--coffee-pale);
  color: var(--coffee);
}

/* 技能标签卡片 */
.skill-tag-card {
  display:inline-flex; align-items:center; gap:6px;
  padding:10px 18px; border-radius:12px;
  background:var(--white);
  border:1px solid var(--coffee-pale);
  box-shadow:var(--shadow-sm);
  font-size:14px; font-weight:500; color:var(--text);
  transition:all var(--transition);
  flex-direction:column; align-items:flex-start;
}
.skill-tag-card:hover {
  box-shadow:var(--shadow);
  border-color:var(--coffee-light);
  transform:translateY(-1px);
}
/* ================================================================
   技能区
   ================================================================ */
.skills-categories { display:flex; flex-direction:column; gap:28px; }
.skill-cat-name {
  font-family: var(--font-serif);
  font-size: 18px; font-weight: bold;
  color: var(--coffee); margin-bottom: 12px;
  padding-bottom: 6px;
  border-bottom: 2px solid var(--matcha-pale);
}
.skills-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap:12px; }
.skill-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
.skill-name { font-size: 14px; font-weight: 600; color: var(--text); }
.skill-level { font-size: 12px; color: var(--text-hint); }
.skill-bar {
  height: 6px; background: var(--cream-dark); border-radius: 3px; overflow: hidden;
}
.skill-bar-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, var(--matcha), var(--matcha-light));
  transition: width 0.8s ease;
}

/* ================================================================
   作品集
   ================================================================ */
.filter-bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom: 28px; }
.filter-bar .tag { cursor:pointer; }
.project-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}
.project-card-large { grid-column: span 2; }
.project-card-small { max-width: 260px; }
.project-card {
  background: var(--white);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: 0 1px 3px rgba(74,39,34,0.04), 0 4px 12px rgba(74,39,34,0.04);
  cursor: pointer;
  transition: all 0.35s cubic-bezier(0.25,0.46,0.45,0.94);
  border: 1px solid rgba(139,111,94,0.06);
}
.project-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 8px 30px rgba(74,39,34,0.12), 0 2px 8px rgba(74,39,34,0.06);
  border-color: var(--coffee-pale);
}
.project-card:hover .project-cover,
.project-card:hover .project-cover-placeholder {
  transform: scale(1.04);
}
.project-cover, .project-cover-placeholder {
  transition: transform 0.5s ease;
}
.project-card.featured { grid-column: span 2; }
.project-cover {
  width: 100%; height: 200px; object-fit: cover;
  background: linear-gradient(135deg, var(--matcha-pale), var(--cream-dark));
}
.project-cover-placeholder {
  width: 100%; height: 200px;
  background: linear-gradient(135deg, var(--matcha-pale), var(--cream-dark));
  display: flex; align-items: center; justify-content: center;
  font-size: 52px;
}
.project-body { padding: 18px 20px 20px; }
.project-name { font-size: 17px; font-weight: bold; color: var(--coffee-deep); margin-bottom: 6px; }
.project-desc {
  font-size: 13px; color: var(--text-secondary); line-height: 1.6;
  display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
  margin-bottom: 10px;
}
.project-tags { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px; }
.project-date { font-size: 11px; color: var(--text-hint); }
.project-link-hint { font-size: 12px; color: var(--matcha); }

/* ================================================================
   时间线（经历）
   ================================================================ */
.timeline { position:relative; padding-left:28px; }
.timeline::before {
  content:''; position:absolute; left:7px; top:4px; bottom:4px;
  width:2px; background: var(--coffee-pale);
}
.timeline-item { position:relative; margin-bottom: 28px; }
.timeline-item::before {
  content:''; position:absolute;
  left: -25px; top: 6px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--matcha);
  border: 2px solid var(--white);
  box-shadow: 0 0 0 2px var(--matcha);
}
.timeline-date { font-size: 13px; color: var(--matcha); margin-bottom: 2px; font-weight: 600; }
.timeline-title { font-size: 17px; font-weight: bold; color: var(--coffee-deep); }
.timeline-subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 4px; }
.timeline-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.7; white-space:pre-line; }

/* ================================================================
   联系区
   ================================================================ */
.contact-cards { display:grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap:14px; }
.contact-card {
  display: flex; align-items: center; gap: 14px;
  padding: 18px 20px;
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  text-decoration: none; color: var(--text);
  transition: all var(--transition);
  border: 1px solid rgba(139,111,94,0.06);
}
.contact-card:hover { box-shadow: var(--shadow); border-color: var(--matcha-light); }
.contact-icon {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--matcha-pale);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}
.contact-label { font-size: 11px; color: var(--text-hint); }
.contact-value { font-size: 14px; color: var(--text); font-weight: 500; }

/* ================================================================
   关于我
   ================================================================ */
.about-text {
  font-size: 15px; color: var(--text-secondary);
  line-height: 1.9; white-space: pre-line;
  max-width: 680px;
}
.about-hobbies { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }

/* ================================================================
   页脚
   ================================================================ */
.footer {
  text-align: center; padding: 32px 28px;
  border-top: 1px solid rgba(139,111,94,0.08);
  color: var(--text-hint); font-size: 12px;
}
.footer .btn { margin: 0 4px; }

/* ================================================================
   弹窗
   ================================================================ */
.modal-overlay {
  position: fixed; inset:0;
  background: rgba(74,39,34,0.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 200; animation: fadeIn 0.2s ease;
}
.modal {
  background: var(--white);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  max-width: 620px; width: 92%; max-height: 85vh;
  overflow-y: auto; padding: 30px;
  position: relative;
}
.modal-close {
  position: absolute; top: 12px; right: 12px;
  width: 34px; height: 34px; border-radius: 50%;
  border: none; background: var(--cream-dark); color: var(--coffee);
  font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--coffee-pale); color: #fff; }
.modal-title { font-family: var(--font-serif); font-size: 22px; font-weight: bold; color: var(--coffee-deep); margin-bottom: 14px; }

/* 轮播 — Apple Cover Flow */
.carousel { position:relative; margin-bottom:18px; height:360px; overflow:hidden; perspective:2000px; background:transparent; border-radius:var(--radius); }
.carousel-track { position:relative; height:100%; width:100%; }
.carousel-card { position:absolute; top:50%; left:50%; width:65%; max-width:850px; border-radius:0; overflow:visible; cursor:pointer; transition:all 0.45s cubic-bezier(0.25,0.46,0.45,0.94); background:none; }
.carousel-card::after { display:none; }
.carousel-card img {
  width:100%; display:block; max-height:340px; object-fit:contain;
  background:none; border-radius:4px;
  box-shadow:0 4px 30px rgba(0,0,0,0.12);
  transition:box-shadow 0.45s ease;
}
.carousel-placeholder { width:100%; height:100%; min-height:300px; display:flex; align-items:center; justify-content:center; font-size:64px; color:var(--coffee-pale); }
.carousel-btn { position:absolute; top:50%; transform:translateY(-50%); width:40px; height:40px; border-radius:50%; border:none; background:rgba(0,0,0,0.08); color:var(--coffee); font-size:16px; cursor:pointer; z-index:20; transition:background 0.2s; }
.carousel-btn:hover { background:rgba(0,0,0,0.18); }
.carousel-btn.prev { left:8px; }
.carousel-btn.next { right:8px; }
.carousel-dots { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); display:flex; gap:6px; z-index:20; }
.carousel-dot { width:8px; height:8px; border-radius:50%; border:none; background:var(--coffee-pale); cursor:pointer; transition:all 0.2s; }
.carousel-dot.active { background:var(--coffee); transform:scale(1.4); }

/* ================================================================
   管理模式
   ================================================================ */
.admin-badge {
  display: none;
  position: fixed; top: 68px; right: 20px;
  background: var(--red); color: #fff;
  padding: 3px 14px; border-radius: 14px;
  font-size: 11px; font-weight: bold; z-index: 150;
}
body.admin-mode .admin-badge { display:block; }

.edit-actions { display:none; gap:6px; margin-top:10px; }
body.admin-mode .edit-actions { display:flex; }

.admin-section-controls { display:none; gap:6px; margin-bottom:14px; }
body.admin-mode .admin-section-controls { display:flex; }

body.admin-mode .card,
body.admin-mode .project-card,
body.admin-mode .contact-card {
  position:relative;
}
body.admin-mode .card:hover,
body.admin-mode .project-card:hover,
body.admin-mode .contact-card:hover {
  outline: 2px dashed var(--matcha);
  outline-offset: -2px;
}

/* 管理表单 */
.admin-form-modal {
  position:fixed; inset:0; z-index:300;
  background:rgba(74,39,34,0.45);
  display:flex; align-items:center; justify-content:center;
  animation:fadeIn 0.2s ease;
}
.admin-form {
  background:var(--white); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);
  max-width:540px; width:92%; max-height:85vh;
  overflow-y:auto; padding:28px; position:relative;
}
.admin-form h3 { font-family:var(--font-serif); font-size:19px; color:var(--coffee-deep); margin-bottom:18px; }
.admin-form-close {
  position:absolute; top:10px; right:10px;
  width:30px; height:30px; border-radius:50%;
  border:none; background:var(--cream-dark); color:var(--coffee);
  font-size:14px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.form-group { margin-bottom:14px; }
.form-group label { display:block; font-size:13px; font-weight:600; color:var(--text); margin-bottom:4px; }
.form-input {
  width:100%; height:38px; padding:0 10px;
  font-size:14px; font-family:var(--font-sans);
  border:1px solid var(--coffee-pale); border-radius:6px;
  background:var(--white); color:var(--text);
  outline:none; transition:border-color var(--transition);
}
.form-input:focus { border-color:var(--matcha); border-width:2px; padding:0 9px; }
.form-textarea {
  width:100%; min-height:90px; padding:8px 10px;
  font-size:14px; font-family:var(--font-sans);
  border:1px solid var(--coffee-pale); border-radius:6px;
  background:var(--white); color:var(--text);
  outline:none; resize:vertical; transition:border-color var(--transition);
}
.form-textarea:focus { border-color:var(--matcha); border-width:2px; padding:7px 9px; }
.form-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; }
.upload-area {
  border:2px dashed var(--coffee-pale); border-radius:8px;
  padding:20px; text-align:center; color:var(--text-hint);
  cursor:pointer; transition:border-color var(--transition);
}
.upload-area:hover { border-color:var(--matcha); color:var(--matcha); }
.upload-preview { width:100%; max-height:180px; object-fit:contain; margin-top:10px; border-radius:6px; }
.add-btn { display:none; }
body.admin-mode .add-btn { display:inline-flex; }

/* ================================================================
   动画
   ================================================================ */
@keyframes fadeIn { from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }
.fade-in { opacity:0; transform:translateY(16px); transition:opacity 0.5s ease, transform 0.5s ease; }
.fade-in.visible { opacity:1; transform:translateY(0); }

/* ================================================================
   响应式
   ================================================================ */
@media (max-width: 768px) {
  .navbar { padding:0 14px; }
  .nav-links a { padding:5px 10px; font-size:12px; }
  .hero-name { font-size:32px; }
  .hero { padding:100px 16px 48px; }
  .section { padding:48px 16px; }
  .section-title { font-size:24px; }
  .project-card.featured { grid-column: span 1; }
  .project-grid { grid-template-columns: 1fr; }
  .nav-right .btn span { display:none; }
}
@media (max-width: 480px) {
  .nav-brand { font-size:16px; }
  .nav-links { gap:0; }
  .nav-links a { padding:4px 8px; font-size:11px; }
  .hero-name { font-size:26px; }
  .project-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

// ---- 生成演示占位图片（Canvas 画图，兼容所有浏览器） ----
function generateDemoImage(title, label, color, w, h) {
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  // 渐变背景
  const grad = ctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, color);
  grad.addColorStop(1, '#3D1F18');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
  // 装饰圆
  ctx.globalAlpha = 0.08;
  for(let i=0; i<6; i++) {
    ctx.beginPath(); ctx.arc(w*(0.2+i*0.15), h*0.45, 80, 0, Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 图标
  ctx.font = '64px sans-serif'; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillText('📷', w/2, h*0.38);
  // 标题
  ctx.font = 'bold 26px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fillText(title, w/2, h*0.55);
  // 标签
  ctx.font = '16px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillText(label, w/2, h*0.62);
  // 分隔线
  ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(w/2-50, h*0.69); ctx.lineTo(w/2+50, h*0.69); ctx.stroke();
  // 提示
  ctx.font = '12px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillText('◀  左右滑动查看  ▶', w/2, h*0.76);
  return canvas.toDataURL('image/jpeg', 0.92);
}
function generateDemoImages(title, labels) {
  const colors = ['#6B3D2E','#7B8D6E','#8B6F5E','#A8B89A'];
  const sizes = [[1600,900],[1600,800],[1600,1000],[1400,900]];
  return labels.map((label, i) => {
    const [w,h] = sizes[i % sizes.length];
    return generateDemoImage(title, label, colors[i % colors.length], w, h);
  });
}

// ---- IndexedDB 操作 ----
function openDB() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = e => { if(!e.target.result.objectStoreNames.contains(STORE_NAME)) e.target.result.createObjectStore(STORE_NAME); };
    r.onsuccess = e => resolve(e.target.result);
    r.onerror = e => reject(e.target.error);
  });
}
async function loadData() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME,'readonly');
    const r = tx.objectStore(STORE_NAME).get(DATA_KEY);
    r.onsuccess = () => {
      if(r.result) resolve(r.result);
      else { const d = getDefaultData(); saveData(d).then(() => resolve(d)); }
    };
    r.onerror = () => reject(r.error);
    tx.oncomplete = () => db.close();
  });
}
async function saveData(data) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME,'readwrite');
    tx.objectStore(STORE_NAME).put(data, DATA_KEY);
    tx.oncomplete = () => { db.close(); resolve(); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  });
}

  if(p.experience) metaItems.push(`<span>💼 ${escapeHtml(p.experience)}</span>`);

// 头像裁剪器
async function uploadProfilePhoto() {
  const overlay = document.createElement('div');
  overlay.className = 'admin-form-modal';
  overlay.innerHTML = `<div class="admin-form" style="max-width:500px;text-align:center;">
    <button class="admin-form-close" id="cropClose">✕</button>
    <h3>✂️ 裁剪头像</h3>
    <div style="width:300px;height:300px;margin:16px auto;border-radius:50%;overflow:hidden;background:#ddd;position:relative;cursor:grab;" id="cropBox">
      <canvas id="cropCanvas" width="300" height="300" style="display:block;width:300px;height:300px;"></canvas>
    </div>
    <p style="font-size:12px;color:var(--text-hint);">🖱️ 滚轮缩放 · 拖拽移动 · 圆形裁剪</p>
    <input type="range" id="cropZoom" min="0.3" max="4" step="0.02" value="1" style="width:200px;margin:8px 0;">
    <div class="form-actions" style="justify-content:center;">
      <button class="btn btn-outline" id="cropUploadBtn">📷 选择图片</button>
      <button class="btn btn-outline" id="cropCancelBtn">取消</button>
      <button class="btn btn-primary" id="cropSaveBtn">✂️ 裁剪保存</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);

  const box = overlay.querySelector('#cropBox');
  const canvas = overlay.querySelector('#cropCanvas');
  const ctx = canvas.getContext('2d');
  const SIZE = 300;

  let img = null;
  let scale = 1, offX = 0, offY = 0;
  let dragging = false, lastMX = 0, lastMY = 0;
  let hasImg = false;

  function redraw() {
    ctx.clearRect(0, 0, SIZE, SIZE);
    if(!hasImg || !img) { ctx.fillStyle = '#ddd'; ctx.fillRect(0,0,SIZE,SIZE); return; }
    ctx.save();
    ctx.beginPath(); ctx.arc(SIZE/2, SIZE/2, SIZE/2, 0, Math.PI*2); ctx.clip();
    ctx.fillStyle = '#ddd'; ctx.fillRect(0,0,SIZE,SIZE);
    ctx.drawImage(img, offX, offY, img.width * scale, img.height * scale);
    ctx.restore();
  }

  function loadImg(src) {
    img = new Image();
    img.onload = function() {
      hasImg = true;
      const s = Math.max(SIZE / img.width, SIZE / img.height);
      scale = s;
      offX = (SIZE - img.width * s) / 2;
      offY = (SIZE - img.height * s) / 2;
      const slider = overlay.querySelector('#cropZoom');
      if(slider) slider.value = s;
      redraw();
    };
    img.src = src;
  }

  // 加载已有头像
  if(appData.profile.photo) loadImg(appData.profile.photo);
  else redraw();

  // 滚轮
  box.addEventListener('wheel', function(e) {
    e.preventDefault(); e.stopPropagation();
    if(!hasImg) return;
    const oldS = scale;
    scale = Math.max(0.3, Math.min(4, scale - e.deltaY * 0.003));
    const rect = box.getBoundingClientRect();
    const mx = e.clientX - rect.left - SIZE/2;
    const my = e.clientY - rect.top - SIZE/2;
    offX = mx + (offX - mx) * (scale / oldS);
    offY = my + (offY - my) * (scale / oldS);
    const slider = overlay.querySelector('#cropZoom');
    if(slider) slider.value = scale;
    redraw();
  }, {passive:false});

  // 拖拽
  function onDown(e) {
    if(!hasImg) return;
    dragging = true; lastMX = e.clientX; lastMY = e.clientY;
    box.style.cursor = 'grabbing';
    e.preventDefault();
  }
  function onMove(e) {
    if(!dragging) return;
    offX += e.clientX - lastMX;
    offY += e.clientY - lastMY;
    lastMX = e.clientX; lastMY = e.clientY;
    redraw();
  }
  function onUp() { dragging = false; if(box) box.style.cursor = 'grab'; }

  box.addEventListener('mousedown', onDown);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);

  // 滑块
  overlay.querySelector('#cropZoom').addEventListener('input', function() {
    if(!hasImg) return;
    const oldS = scale;
    scale = parseFloat(this.value);
    offX = SIZE/2 + (offX - SIZE/2) * (scale / oldS);
    offY = SIZE/2 + (offY - SIZE/2) * (scale / oldS);
    redraw();
  });

  // 选图
  overlay.querySelector('#cropUploadBtn').addEventListener('click', function() {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = function() {
      if(!this.files[0]) return;
      const r = new FileReader();
      r.onload = function(ev) { loadImg(ev.target.result); };
      r.readAsDataURL(this.files[0]);
    };
    inp.click();
  });

  // 清理
  function cleanup() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    overlay.remove();
  }

  // 保存
  overlay.querySelector('#cropSaveBtn').addEventListener('click', async function() {
    if(!hasImg || !img) return;
    const out = document.createElement('canvas');
    out.width = SIZE; out.height = SIZE;
    const octx = out.getContext('2d');
    octx.beginPath(); octx.arc(SIZE/2, SIZE/2, SIZE/2, 0, Math.PI*2); octx.clip();
    octx.drawImage(img, offX, offY, img.width * scale, img.height * scale);
    appData.profile.photo = out.toDataURL('image/jpeg', 0.9);
    await saveAndRefresh();
    cleanup();
  });

  overlay.querySelector('#cropClose').addEventListener('click', cleanup);
  overlay.querySelector('#cropCancelBtn').addEventListener('click', cleanup);
  overlay.addEventListener('click', function(e) { if(e.target === overlay) cleanup(); });
}

function renderProjects(filterText) {
  const grid = document.getElementById('projectGrid');
  const filterBar = document.getElementById('filterBar');

  let projects = appData.projects || [];
  const keyword = (filterText||'').trim().toLowerCase();

  // 分类筛选
  if(currentFilter !== '全部') {
    projects = projects.filter(p => p.category === currentFilter);
  }
  // 搜索
  if(keyword) {
    projects = projects.filter(p => p.name.toLowerCase().includes(keyword)
      || p.description.toLowerCase().includes(keyword)
      || (p.tags||[]).some(t => t.toLowerCase().includes(keyword)));
  }

  // 筛选栏
  const allCats = ['全部', ...new Set((appData.projects||[]).map(p => p.category || '未分类').filter(Boolean))];
  filterBar.innerHTML = allCats.map(c =>
    `<span class="tag ${c === currentFilter ? 'tag-active' : ''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</span>`
  ).join('');

  if(!projects.length) {
    grid.innerHTML = `<p style="color:var(--text-hint);text-align:center;padding:40px;grid-column:1/-1;">${keyword ? '没有匹配的项目':'暂无项目'}</p>`;

  grid.innerHTML = projects.map((proj, idx) => {

    const sizeClass = size === 'large' ? ' project-card-large' : (size === 'small' ? ' project-card-small' : '');

    if(proj.images && proj.images.length>0) coverHtml = `<img class="project-cover" src="${proj.images[0]}" alt="${escapeHtml(proj.name)}" style="height:${coverH};">`;
    else coverHtml = `<div class="project-cover-placeholder" style="height:${coverH};">💼</div>`;

    const tagsHtml = (proj.tags||[]).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
    const linkHint = proj.link ? '<span class="project-link-hint">🔗 有链接</span>' : '';

    return `<div class="project-card${sizeClass}" data-id="${proj.id}">
      ${coverHtml}
      <div class="project-body">
        <div class="project-name">${escapeHtml(proj.name)}</div>
        <div class="project-desc">${escapeHtml(proj.description)}</div>
        <div class="project-tags">${tagsHtml}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span class="project-date">📅 ${escapeHtml(proj.date||'')}</span>
          ${linkHint}
        </div>
        ${isAdminMode ? `<div class="edit-actions" style="margin-top:10px;">
          ${idx > 0 ? `<button class="btn btn-sm btn-outline edit-proj-up-btn" data-id="${proj.id}">⬆</button>` : ''}
          ${idx < projects.length-1 ? `<button class="btn btn-sm btn-outline edit-proj-down-btn" data-id="${proj.id}">⬇</button>` : ''}

          <button class="btn btn-sm btn-danger del-proj-btn" data-id="${proj.id}">🗑️</button>

    </div>`;
  }).join('');

  grid.querySelectorAll('.project-card').forEach(card => {
    card.addEventListener('click', function(e) {
      if(e.target.closest('.edit-actions') || e.target.closest('button')) return;

    });
  });

  filterBar.querySelectorAll('.tag').forEach(tag => {
    tag.addEventListener('click', function() {
      currentFilter = this.dataset.cat;
      renderProjects(document.getElementById('searchInput').value);
    });
  });

function sortByDate(arr) {
  return [...arr].sort((a,b) => {
    const da = a.endDate || a.startDate || '';
    const db = b.endDate || b.startDate || '';
    if(da === '至今') return -1; if(db === '至今') return 1;
    return db.localeCompare(da); // 倒序：最近的在前面
  });
}

/* ================================================================
   全屏图片查看
   ================================================================ */
function showFullscreenImage(src, allImages) {
  let idx = allImages.indexOf(src);
  if(idx < 0) idx = 0;

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;z-index:999;background:rgba(20,12,8,0.88);overflow:hidden;';
  overlay.innerHTML = `<button id="fsClose" style="position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,0.12);color:#fff;font-size:20px;cursor:pointer;z-index:30;">✕</button>
    <div id="fsCounter" style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.5);font-size:13px;z-index:30;">${idx+1} / ${allImages.length}</div>
    <div id="fsDots" style="position:absolute;bottom:44px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:30;"></div>
    <div id="fsTrack" style="position:relative;width:100%;height:100vh;"></div>`;

  document.body.appendChild(overlay);

  const track = overlay.querySelector('#fsTrack');
  const dotContainer = overlay.querySelector('#fsDots');

  // 创建卡片
  allImages.forEach((img, i) => {
    const card = document.createElement('div');
    card.style.cssText = 'position:absolute;top:50%;left:50%;width:70%;max-width:900px;border-radius:10px;overflow:visible;cursor:pointer;transition:all 0.45s cubic-bezier(0.25,0.46,0.45,0.94);';
    card.innerHTML = `<img src="${img}" style="width:100%;display:block;max-height:75vh;object-fit:contain;border-radius:10px;box-shadow:0 4px 40px rgba(0,0,0,0.5);">`;
    track.appendChild(card);

    const dot = document.createElement('button');
    dot.style.cssText = 'width:8px;height:8px;border-radius:50%;border:none;background:rgba(255,255,255,0.3);cursor:pointer;transition:all 0.2s;';
    dot.dataset.index = i;
    dotContainer.appendChild(dot);
  });

  const cards = track.querySelectorAll('div');
  const dots = dotContainer.querySelectorAll('button');
  let canSwitch = true;

  function updateFS() {
    cards.forEach((card, i) => {
      const offset = i - idx;
      const abs = Math.abs(offset);
      const x = offset * 28;
      const scale = Math.max(0.45, 1 - abs * 0.2);
      const opacity = Math.max(0.08, 1 - abs * 0.26);
      card.style.transform = `translate(-50%,-50%) translateX(${x}%) scale(${scale})`;
      card.style.opacity = opacity;
      card.style.zIndex = 10 - abs;
      card.style.pointerEvents = abs <= 2 ? 'auto' : 'none';
    });
    dots.forEach((d,i) => { d.classList.toggle('active', i===idx); d.style.background = i===idx ? '#fff' : 'rgba(255,255,255,0.3)'; });
    overlay.querySelector('#fsCounter').textContent = `${idx+1} / ${allImages.length}`;
  }
  updateFS();

  // 悬浮切换
  cards.forEach((card, i) => {
    card.addEventListener('mouseenter', () => {
      if(!canSwitch || i===idx) return;
      canSwitch = false; idx = i; updateFS();
      setTimeout(()=> canSwitch=true, 350);
    });
  });

  // 滚轮
  overlay.addEventListener('wheel', e => {
    e.preventDefault();
    if(allImages.length <= 1) return;
    if(e.deltaY > 0) idx = (idx+1) % allImages.length;
    else idx = (idx-1+allImages.length) % allImages.length;
    updateFS();
  }, {passive:false});

  // 键盘
  function keyH(e) {
    if(e.key==='Escape') close();
    if(e.key==='ArrowRight'){ idx=(idx+1)%allImages.length; updateFS(); }
    if(e.key==='ArrowLeft'){ idx=(idx-1+allImages.length)%allImages.length; updateFS(); }
  }
  document.addEventListener('keydown', keyH);

  function close() {
    overlay.remove();
    document.removeEventListener('keydown', keyH);
  }
  overlay.querySelector('#fsClose').addEventListener('click', e => { e.stopPropagation(); close(); });
}

  let carouselHtml;
  if(hasImages) {
    const imgCards = imgs.map((img,i) => `<div class="carousel-card" data-index="${i}" style="opacity:0;pointer-events:none;"><img src="${img}" alt="${escapeHtml(proj.name)} 图${i+1}"></div>`).join('');
    const dotsHtml = imgs.map((_,i) => `<button class="carousel-dot${i===0?' active':''}" data-index="${i}"></button>`).join('');
    carouselHtml = `<div class="carousel">
      <div class="carousel-track" id="carouselTrack">
        ${imgCards}
      </div>
      ${imgs.length>1 ? `
        <button class="carousel-btn prev" id="carouselPrev">◀</button>
        <button class="carousel-btn next" id="carouselNext">▶</button>
        <div class="carousel-dots" id="carouselDots">${dotsHtml}</div>
      ` : ''}
    </div>`;
  } else {
    carouselHtml = `<div class="carousel"><div class="carousel-placeholder">💼</div></div>`;
  }

  overlay.innerHTML = `<div class="modal">
    <button class="modal-close" id="modalClose">✕</button>
    ${carouselHtml}
    <div class="modal-title">${escapeHtml(proj.name)}</div>
    <div class="tag-group" style="margin-bottom:12px;">${(proj.tags||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
    <p style="font-size:14px;color:var(--text-secondary);line-height:1.8;white-space:pre-line;">${escapeHtml(proj.description)}</p>
    ${proj.date ? `<p style="margin-top:10px;font-size:12px;color:var(--text-hint);">📅 ${escapeHtml(proj.date)}</p>` : ''}
    ${proj.link ? `<p style="margin-top:8px;">🔗 <a href="${escapeHtml(proj.link)}" target="_blank" rel="noopener" style="color:var(--matcha);">${escapeHtml(proj.link)}</a></p>` : ''}
  </div>`;
  document.body.appendChild(overlay);

  overlay.querySelector('#modalClose').addEventListener('click', ()=>overlay.remove());
  overlay.addEventListener('click', e => { if(e.target===overlay) overlay.remove(); });
  document.addEventListener('keydown', function escHandler(e) { if(e.key==='Escape'){ overlay.remove(); document.removeEventListener('keydown',escHandler); } });

  // Apple Cover Flow 轮播
  if(hasImages && imgs.length >= 1) {
    let currentIdx = 0;
    const cards = overlay.querySelectorAll('.carousel-card');
    const dots = overlay.querySelectorAll('.carousel-dot');
    let canSwitch = true;

    function updateCoverFlow() {
      cards.forEach((card, i) => {
        const offset = i - currentIdx; // 相对中心的距离
        const absOffset = Math.abs(offset);

        // 左右各2张可见，间距紧凑
        const xShift = offset * 24; // 每张偏移 24%
        const scale = Math.max(0.5, 1 - absOffset * 0.18);
        const opacity = Math.max(0.15, 1 - absOffset * 0.22);
        const zIndex = 10 - absOffset;

        card.style.transform = `translate(-50%, -50%) translateX(${xShift}%) scale(${scale})`;
        card.style.opacity = opacity;
        card.style.zIndex = zIndex;
        card.style.pointerEvents = absOffset <= 3 ? 'auto' : 'none';
      });
      dots.forEach((d,i) => d.classList.toggle('active', i===currentIdx));
    }

    updateCoverFlow();

    // 悬浮切换 + 点击放大
    cards.forEach((card, i) => {
      card.addEventListener('mouseenter', function() {
        if(!canSwitch || i === currentIdx) return;
        canSwitch = false;
        currentIdx = i;
        updateCoverFlow();
        setTimeout(()=>{ canSwitch = true; }, 400);
      });
      // 点击中间图 → 全屏放大
      card.addEventListener('click', function(e) {
        if(i !== currentIdx) return; // 只有当前图响应点击
        e.stopPropagation();
        showFullscreenImage(imgs[currentIdx], imgs);
      });
    });

    // ◀ ▶ 按钮
    overlay.querySelector('#carouselPrev').addEventListener('click', ()=>{
      currentIdx = (currentIdx - 1 + imgs.length) % imgs.length;
      updateCoverFlow();
    });
    overlay.querySelector('#carouselNext').addEventListener('click', ()=>{
      currentIdx = (currentIdx + 1) % imgs.length;
      updateCoverFlow();
    });
    // 圆点
    dots.forEach(dot => {
      dot.addEventListener('click', function(){
        currentIdx = parseInt(this.dataset.index);
        updateCoverFlow();
      });
    });
  }
}

function compressImage(file, maxW, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w=img.width, h=img.height;
        if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function showFormModal(title, fields, onSubmit) {
  const existing = document.querySelector('.admin-form-modal');
  if(existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.className = 'admin-form-modal';

  let fieldsHtml = fields.map(f => {
    if(f.type==='textarea') return `<div class="form-group"><label>${f.label}</label><textarea class="form-textarea" id="field_${f.key}" placeholder="${f.placeholder||''}">${escapeHtml(f.value||'')}</textarea></div>`;
    if(f.type==='image') return `<div class="form-group"><label>${f.label}</label><div class="upload-area" id="field_${f.key}_area"><span>📷 点击上传（自动压缩）</span><input type="file" accept="image/*" id="field_${f.key}_input" style="display:none;">${f.value?`<img class="upload-preview" src="${f.value}" alt="预览">`:''}</div></div>`;
    if(f.type==='tags') return `<div class="form-group"><label>${f.label}</label><input class="form-input" id="field_${f.key}" placeholder="${f.placeholder||'逗号分隔'}" value="${escapeHtml((f.value||[]).join(', '))}"></div>`;
    return `<div class="form-group"><label>${f.label}</label><input class="form-input" id="field_${f.key}" placeholder="${f.placeholder||''}" value="${escapeHtml(f.value||'')}"></div>`;
  }).join('');

  overlay.innerHTML = `<div class="admin-form">
    <button class="admin-form-close" id="afClose">✕</button>
    <h3>${title}</h3>${fieldsHtml}
    <div class="form-actions">
      <button class="btn btn-outline" id="afCancel">取消</button>
      <button class="btn btn-primary" id="afSave">💾 保存</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);

  function close(){ overlay.remove(); }
  overlay.querySelector('#afClose').addEventListener('click',close);
  overlay.querySelector('#afCancel').addEventListener('click',close);
  overlay.addEventListener('click',e=>{ if(e.target===overlay) close(); });

  fields.filter(f=>f.type==='image').forEach(f=>{
    const area = overlay.querySelector('#field_'+f.key+'_area');
    const input = overlay.querySelector('#field_'+f.key+'_input');
    area.addEventListener('click',()=>input.click());
    input.addEventListener('change',async function(){
      if(!this.files[0]) return;
      const b64 = await compressImage(this.files[0], 800, 0.7);
      f._uploaded = b64;
      const prev = area.querySelector('.upload-preview');
      if(prev) prev.src = b64;
      else { const img=document.createElement('img'); img.className='upload-preview'; img.src=b64; area.appendChild(img); }
    });
  });

  overlay.querySelector('#afSave').addEventListener('click',()=>{
    const vals = {};
    fields.forEach(f => {
      if(f.type==='image') vals[f.key] = f._uploaded || f.value || '';
      else if(f.type==='tags') vals[f.key] = overlay.querySelector('#field_'+f.key).value.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
      else vals[f.key] = overlay.querySelector('#field_'+f.key).value;
    });
    close();
    onSubmit(vals);
  });

  document.addEventListener('keydown', function escH(e){ if(e.key==='Escape'){ close(); document.removeEventListener('keydown',escH); } });
}

function swapAdjacent(arr, id, dir) {
  if(!arr) return;
  const idx = arr.findIndex(e=>e.id===id);
  if(idx<0 || idx+dir<0 || idx+dir>=arr.length) return;
  [arr[idx], arr[idx+dir]] = [arr[idx+dir], arr[idx]];
}

function showLayoutPanel() {
  const overlay = document.createElement('div');
  overlay.className = 'admin-form-modal';

  const order = appData.sectionOrder || SECTION_META.map(s=>s.id);
  const items = SECTION_META.map(meta => {
    const idx = order.indexOf(meta.id);
    return { ...meta, idx: idx>=0 ? idx : 999 };
  }).sort((a,b) => a.idx - b.idx);

  const listHtml = items.map((item, i) => `
    <div style="display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:6px;
      background:${item.fixed?'var(--cream-dark)':'var(--white)'};border-radius:8px;
      border:1px solid var(--coffee-pale);${item.fixed?'opacity:0.7':''}">
      <span style="font-size:20px;">${item.icon}</span>
      <span style="flex:1;font-weight:600;color:var(--text);">${item.name}</span>
      ${item.fixed ? '<span style="font-size:11px;color:var(--text-hint);">固定</span>' : `
        <button class="btn btn-sm btn-outline layout-up" data-id="${item.id}" ${i===0?'disabled':''}>⬆</button>
        <button class="btn btn-sm btn-outline layout-down" data-id="${item.id}" ${i===items.length-1?'disabled':''}>⬇</button>
      `}
    </div>
  `).join('');

  overlay.innerHTML = `<div class="admin-form">
    <button class="admin-form-close" id="layoutClose">✕</button>
    <h3>📐 调整板块布局顺序</h3>
    <p style="font-size:13px;color:var(--text-hint);margin-bottom:14px;">点击 ⬆ ⬇ 调整顺序，首页固定不可移动</p>
    <div id="layoutList">${listHtml}</div>
    <div class="form-actions">
      <button class="btn btn-outline" id="layoutReset">🔄 恢复默认</button>
      <button class="btn btn-outline" id="layoutCancel">取消</button>
      <button class="btn btn-primary" id="layoutSave">💾 保存</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);

  function close(){ overlay.remove(); }
  overlay.querySelector('#layoutClose').addEventListener('click',close);
  overlay.querySelector('#layoutCancel').addEventListener('click',close);
  overlay.addEventListener('click',e=>{ if(e.target===overlay) close(); });

  // ⬆ ⬇ 按钮
  overlay.querySelectorAll('.layout-up').forEach(btn => {
    btn.addEventListener('click', function() {
      const id = this.dataset.id;
      const idx = order.indexOf(id);
      if(idx>1) { [order[idx], order[idx-1]] = [order[idx-1], order[idx]]; }
      overlay.remove(); showLayoutPanel();
    });
  });
  overlay.querySelectorAll('.layout-down').forEach(btn => {
    btn.addEventListener('click', function() {
      const id = this.dataset.id;
      const idx = order.indexOf(id);
      if(idx>=1 && idx<order.length-1) { [order[idx], order[idx+1]] = [order[idx+1], order[idx]]; }
      overlay.remove(); showLayoutPanel();
    });
  });

  // 保存
  overlay.querySelector('#layoutSave').addEventListener('click', async () => {
    appData.sectionOrder = order;
    await saveAndRefresh();
    applySectionOrder();
    close();
  });

  // 恢复默认
  overlay.querySelector('#layoutReset').addEventListener('click', () => {
    appData.sectionOrder = ['hero','about','projects','experience','skills','contact'];
    overlay.remove();
    showLayoutPanel();
  });
}

function applySectionOrder() {
  const order = appData.sectionOrder || SECTION_META.map(s=>s.id);
  const main = document.querySelector('.main-content') || document.body;

  // 收集所有 section 的容器
  const allSections = {};
  document.querySelectorAll('section[id]').forEach(s => allSections[s.id] = s);

  // 找到第一个 section 的父容器
  const container = document.getElementById('hero').parentNode;

  // 按 order 重新排列
  let prevEl = null;
  order.forEach(sectionId => {
    const el = document.getElementById(sectionId);
    if(!el) return;
    if(prevEl) {
      prevEl.insertAdjacentElement('afterend', el);
    } else {
      container.insertBefore(el, container.firstChild);
    }
    prevEl = el;
  });

  // 同步导航栏
  updateNavOrder(order);
}

function updateNavOrder(order) {
  const navLinks = document.querySelector('.nav-links');
  const existingLinks = {};
  navLinks.querySelectorAll('a').forEach(a => {
    existingLinks[a.dataset.section] = a;
  });

  const sectionToNav = {
    'hero': 'hero', 'about': 'about', 'projects': 'projects',
    'experience': 'experience', 'skills': 'skills', 'contact': 'contact'
  };

  navLinks.innerHTML = '';
  order.forEach(sectionId => {
    const navId = sectionToNav[sectionId];
    const meta = SECTION_META.find(s=>s.id===sectionId);
    if(!meta) return;
    const a = document.createElement('a');
    a.href = '#' + sectionId;
    a.dataset.section = navId || sectionId;
    a.textContent = meta.icon + ' ' + meta.name;
    a.addEventListener('click', function(e) {
      e.preventDefault();
      document.querySelectorAll('.nav-links a').forEach(l=>l.classList.remove('active'));
      this.classList.add('active');
      document.getElementById(sectionId).scrollIntoView({ behavior:'smooth' });
    });
    navLinks.appendChild(a);
  });

  // 重新缓存导航链接
  refreshNavCache();
}

function refreshNavCache() {
  const links = document.querySelectorAll('.nav-links a');
  sections.length = 0;
  links.forEach(a => {
    const el = document.querySelector(a.getAttribute('href'));
    if(el) sections.push({el, a});
  });
  updateActiveNav();
}

function applyTheme(theme) {
  const root = document.documentElement;

  root.style.setProperty('--coffee-deep', cs.primary);

  root.style.setProperty('--cream', cs.bg);

function showThemePanel() {
  const theme = appData.theme || {};

  const overlay = document.createElement('div');
  overlay.className = 'admin-form-modal';

  const colorOptions = Object.entries(COLOR_SCHEMES).map(([key, cs]) => `
    <div class="theme-color-opt" data-color="${key}" style="
      display:inline-flex;align-items:center;gap:8px;padding:8px 14px;margin:4px;
      border-radius:20px;cursor:pointer;border:2px solid ${theme.colorScheme===key?'var(--coffee)':'transparent'};
      background:var(--cream-dark);">
      <span style="width:16px;height:16px;border-radius:50%;background:${cs.primary};display:inline-block;"></span>
      <span style="width:16px;height:16px;border-radius:50%;background:${cs.accent};display:inline-block;"></span>
      <span style="font-size:13px;">${cs.name}</span>
    </div>
  `).join('');

  function fontPicker(key, label, currentVal) {
    const opts = FONT_OPTIONS[key];
    return `<div style="margin-bottom:12px;">
      <label style="font-size:13px;font-weight:600;">${label}</label>
      <div style="display:flex;flex-wrap:wrap;gap:4px;margin:4px 0;">${opts.map(o => `
        <span class="theme-font-opt" data-font="${key}" data-val="${o.value}" style="
          padding:6px 12px;border-radius:14px;cursor:pointer;font-size:14px;
          border:2px solid ${currentVal===o.value?'var(--coffee)':'var(--coffee-pale)'};
          background:${currentVal===o.value?'var(--cream-dark)':'transparent'};">${o.sample}</span>
      `).join('')}</div>
      <input class="form-input theme-font-input" data-font="${key}" placeholder="或输入任意字体名称..." value="${escapeHtml(theme[key.startsWith('custom')?key:'custom'+key.charAt(0).toUpperCase()+key.slice(1)]||'')}" style="height:32px;font-size:13px;">
    </div>`;
  }

  overlay.innerHTML = `<div class="admin-form" style="max-width:560px;">
    <button class="admin-form-close" id="themeClose">✕</button>
    <h3>🎨 主题设置</h3>

    <label style="font-size:13px;font-weight:600;">配色方案</label>
    <div style="margin-bottom:12px;">${colorOptions}</div>

    <label style="font-size:13px;font-weight:600;">自定义颜色</label>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
      <div><label style="font-size:11px;color:var(--text-hint);">姓名颜色</label><input type="color" class="theme-color-input" data-key="nameColor" value="${theme.nameColor||'#ffffff'}" style="width:40px;height:30px;border:none;cursor:pointer;"></div>
      <div><label style="font-size:11px;color:var(--text-hint);">头衔颜色</label><input type="color" class="theme-color-input" data-key="titleColor" value="${theme.titleColor||'rgba(255,255,255,0.9)'}" style="width:40px;height:30px;border:none;cursor:pointer;"></div>
      <div><label style="font-size:11px;color:var(--text-hint);">正文颜色</label><input type="color" class="theme-color-input" data-key="textColor" value="${theme.textColor||'#3D2C26'}" style="width:40px;height:30px;border:none;cursor:pointer;"></div>
    </div>

    ${fontPicker('nameFont', '姓名字体', theme.nameFont||'fangsong')}
    ${fontPicker('titleFont', '标题字体', theme.titleFont||'serif')}
    ${fontPicker('bodyFont', '正文字体', theme.bodyFont||'sans')}

    <div class="form-actions">
      <button class="btn btn-outline" id="themeReset">🔄 默认</button>
      <button class="btn btn-outline" id="themeCancel">取消</button>
      <button class="btn btn-primary" id="themeSave">💾 保存</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);

  function close(){ overlay.remove(); }
  overlay.querySelector('#themeClose').addEventListener('click',close);
  overlay.querySelector('#themeCancel').addEventListener('click',close);
  overlay.addEventListener('click',e=>{ if(e.target===overlay) close(); });

  // 配色选择
  overlay.querySelectorAll('.theme-color-opt').forEach(opt => {
    opt.addEventListener('click', function() {
      theme.colorScheme = this.dataset.color;
      applyTheme(theme);
      overlay.remove(); showThemePanel();
    });
  });

  // 颜色输入
  overlay.querySelectorAll('.theme-color-input').forEach(input => {
    input.addEventListener('input', function() {
      theme[this.dataset.key] = this.value;
      applyTheme(theme);
    });
  });

  // 字体预设
  overlay.querySelectorAll('.theme-font-opt').forEach(opt => {
    opt.addEventListener('click', function() {
      theme[this.dataset.font] = this.dataset.val;
      applyTheme(theme);
      overlay.remove(); showThemePanel();
    });
  });

  // 自定义字体输入
  overlay.querySelectorAll('.theme-font-input').forEach(input => {
    const key = 'custom' + input.dataset.font.charAt(0).toUpperCase() + input.dataset.font.slice(1);
    input.addEventListener('input', function() {
      theme[key] = this.value;
      applyTheme(theme);
    });
  });

  // 保存
  overlay.querySelector('#themeSave').addEventListener('click', async () => {
    appData.theme = theme;
    await saveData(appData);
    close();
  });

  // 重置
  overlay.querySelector('#themeReset').addEventListener('click', () => {
    const def = { nameFont:'fangsong', titleFont:'serif', bodyFont:'sans', colorScheme:'coffee', nameColor:'#ffffff', titleColor:'rgba(255,255,255,0.9)', textColor:'#3D2C26', customNameFont:'', customTitleFont:'', customBodyFont:'' };
    Object.assign(theme, def);
    applyTheme(theme);
    overlay.remove(); showThemePanel();
  });
}

document.getElementById('themeBtn').addEventListener('click', showThemePanel);

/* ================================================================
   导航：平滑滚动 + 高亮
   ================================================================ */
document.querySelectorAll('.nav-links a').forEach(link => {
  link.addEventListener('click', function(e) {
    e.preventDefault();
    const target = document.querySelector(this.getAttribute('href'));
    if(target) target.scrollIntoView({ behavior:'smooth' });
  });
});

// 滚动时自动高亮当前区域
const navLinks = document.querySelectorAll('.nav-links a');
const sections = [];
navLinks.forEach(a => { const el = document.querySelector(a.getAttribute('href')); if(el) sections.push({el, a}); });

function updateActiveNav() {
  let current = sections[0];
  sections.forEach(s => {
    if(s.el.getBoundingClientRect().top <= 120) current = s;
  });
  navLinks.forEach(a => a.classList.remove('active'));
  if(current) current.a.classList.add('active');
}
window.addEventListener('scroll', updateActiveNav, {passive:true});

/* ================================================================
   淡入动画
   ================================================================ */
const fadeObserver = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if(entry.isIntersecting) entry.target.classList.add('visible');
  });
}, { threshold: 0.1 });

document.querySelectorAll('.fade-in').forEach(el => fadeObserver.observe(el));

/* ================================================================
   导出/导入
   ================================================================ */
document.getElementById('btnPublish').addEventListener('click', async function() {
  const btn = this;
  btn.textContent = '⏳ 发布中...'; btn.disabled = true;

  let token = localStorage.getItem('gh_publish_token');
  if(!token) {
    token = prompt('🔑 首次使用需要 GitHub Token（只需输入一次）：\n\n获取：github.com/settings/tokens → Generate new token → 勾选 repo → 生成后复制过来');
    if(!token) { btn.textContent = '🔗 生成链接'; btn.disabled = false; return; }
    localStorage.setItem('gh_publish_token', token);
  }

  const repo = 'yifuzhu29-a11y/portfolio';
  const cleanData = JSON.parse(JSON.stringify(appData));
  // 删除内部标记字段
  delete cleanData._sorted;

  const jsonStr = JSON.stringify(cleanData);
  // 用 TextEncoder 正确编码 UTF-8 → base64
  const encoder = new TextEncoder();
  const bytes = encoder.encode(jsonStr);
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  const base64 = btoa(binary);

  // 先获取现有文件 sha
  let sha = '';
  try {
    const r = await fetch(`https://api.github.com/repos/${repo}/contents/data.json`, {
      headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github.v3+json' }
    });
    if(r.ok) { const d = await r.json(); sha = d.sha; }
  } catch(e) {}

  // 上传
  const body = JSON.stringify({ message: '更新数据', content: base64, sha: sha || undefined });

  try {
    const resp = await fetch(`https://api.github.com/repos/${repo}/contents/data.json`, {
      method: 'PUT',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: body
    });

    if(resp.ok) {
      alert('✅ 发布成功！\n\n约 1 分钟后刷新：\nhttps://yifuzhu29-a11y.github.io/portfolio/');
    } else if(resp.status === 401 || resp.status === 403) {
      localStorage.removeItem('gh_publish_token');
      alert('❌ Token 无效，请重新点击按钮并输入新的 Token。');
    } else {
      const err = await resp.json().catch(()=>({}));
      alert('❌ 发布失败：' + (err.message || 'HTTP ' + resp.status) + '\n\n可改用导出备份→发给我→我帮你推。');
    }
  } catch(e) {
    alert('❌ 网络错误：' + e.message + '\n\n请检查网络，或改用导出备份方式。');
  }

  btn.textContent = '🔗 生成链接'; btn.disabled = false;
});

document.getElementById('btnReset').addEventListener('click', async function() {
  if(!confirm('⚠️ 确定要重置为默认数据吗？\n\n这会清空你所有的修改！\n建议先导出备份。')) return;
  appData = getDefaultData();
  await saveData(appData);
  renderAll();
  applySectionOrder();
  alert('✅ 已重置为默认数据。');
});

document.getElementById('btnExport').addEventListener('click', async function() {
  const data = await loadData();
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const today = new Date().toISOString().slice(0,10);
  const a = document.createElement('a');
  a.href=url; a.download='简历备份_'+today+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  alert('✅ 已导出！');
});

const importInput = document.getElementById('importFileInput');
document.getElementById('btnImport').addEventListener('click', ()=>{
  if(!confirm('⚠️ 导入将覆盖当前数据，确定？')) return;
  importInput.click();
});
importInput.addEventListener('change', async function() {
  const file = this.files[0];
  if(!file) return;
  try {
    const text = await new Promise((res,rej)=>{
      const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=rej; r.readAsText(file,'UTF-8');
    });
    const data = JSON.parse(text);
    if(!data.profile && !data.projects) throw new Error('格式不正确');
    await saveData(data);
    appData = data;
    renderAll();
    alert('✅ 导入成功！');
  } catch(err) { alert('❌ 导入失败：'+err.message); }
  this.value = '';
});

/* ================================================================
   初始化
   ================================================================ */
(async function init() {
  try {
    // 优先读取线上共享数据
    let sharedData = null;
    try {
      const resp = await fetch('data.json', {cache:'no-cache'});
      if(resp.ok) sharedData = await resp.json();
    } catch(e) { /* 本地打开或首次使用，没有 data.json */ }

    if(sharedData && sharedData.profile) {
      // 用线上数据覆盖本地
      appData = { ...getDefaultData(), ...sharedData };
      await saveData(appData);
    } else {
      appData = await loadData();
    }
    // 自动修复：旧数据没有演示图的项目 → 注入演示图
    if(appData.projects) {
      let fixed = false;
      appData.projects.forEach(p => {
        if(!p.images || p.images.length === 0) {
          if(p.name === 'AI 真人短剧') { p.images = generateDemoImages('AI 真人短剧', ['分镜设计','AI 生图','成片截图']); fixed = true; }
          else if(p.name === '动画《熠》') { p.images = generateDemoImages('动画《熠》', ['角色设计稿','场景渲染','最终成片']); fixed = true; }
        }
      });
      if(fixed) await saveData(appData);
    }
    if(!appData.sectionOrder) appData.sectionOrder = ['hero','about','projects','experience','skills','contact'];
    if(appData.profile.banner === undefined) appData.profile.banner = '';
    // 迁移旧联系方式格式
    if(appData.contact && !appData.contact.items) {
      const items = [];
      if(appData.contact.email) items.push({ id:genId(), icon:'✉️', label:'邮箱', value:appData.contact.email, link:'mailto:'+appData.contact.email });
      if(appData.contact.phone) items.push({ id:genId(), icon:'📱', label:'电话', value:appData.contact.phone, link:'' });
      if(appData.contact.social) appData.contact.social.forEach(s => items.push({ id:genId(), icon:'🔗', label:s.platform, value:s.url, link:s.url }));
      appData.contact.items = items;
      await saveData(appData);
    }
    if(!appData.theme) appData.theme = { nameFont:'fangsong', titleFont:'serif', bodyFont:'sans', colorScheme:'coffee', customNameFont:'', customTitleFont:'', customBodyFont:'', nameColor:'#ffffff', titleColor:'rgba(255,255,255,0.9)', textColor:'#3D2C26' };
    applyTheme(appData.theme);
    // 首次加载时，经历按时间排序
    if(appData.campusExperience && !appData._sorted) {
      appData.campusExperience = sortByDate(appData.campusExperience);
      appData.internship = sortByDate(appData.internship || []);
      appData.education = sortByDate(appData.education || []);
      appData._sorted = true;
      await saveData(appData);
    }
    renderAll();
    applySectionOrder();
    console.log('✅ 就绪！');
  } catch(err) { console.error('初始化失败:', err); }
})();
</script>
